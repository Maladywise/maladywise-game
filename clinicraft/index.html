<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clinicraft prototype | Malady Wise</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Early prototype of Clinicraft, a merge game about rebuilding a country clinic.">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<style>
@font-face{font-family:Lora;font-weight:700;font-display:swap;src:url(/assets/fonts/lora-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Poppins;font-weight:400;font-display:swap;src:url(/assets/fonts/poppins-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Poppins;font-weight:500;font-display:swap;src:url(/assets/fonts/poppins-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Poppins;font-weight:600;font-display:swap;src:url(/assets/fonts/poppins-latin-600-normal.woff2) format("woff2")}
:root{--bg:#F7F3EC;--card:#FFFFFF;--ink:#2E1F57;--muted:#5B4A86;--line:#E2DCEA;--brand:#6B4FB3;--gold:#E9A23B;--board:#D8CDEE;--cell:#F1ECFA}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.app{max-width:440px;margin:0 auto;padding:12px 14px 40px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
header a{color:var(--muted);text-decoration:none;font-size:14px;min-height:44px;display:inline-flex;align-items:center}
h1{font:700 26px Lora,Georgia,serif;margin:0}
.proto{font:600 10px Poppins;letter-spacing:.12em;color:#fff;background:var(--gold);border-radius:999px;padding:3px 8px;vertical-align:middle}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 10px;border-radius:999px;background:var(--card);font-size:13px;font-weight:600;box-shadow:0 1px 0 rgba(46,31,87,.12)}
.orders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ord{background:var(--card);border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 2px 0 rgba(46,31,87,.08);text-align:center}
.ord .who{font-size:11px;font-weight:600;line-height:1.2}
.ord .need{font-size:10.5px;color:var(--muted);line-height:1.2;min-height:26px}
.ord button{border:0;border-radius:999px;padding:6px 12px;min-height:34px;font:600 12px Poppins;background:var(--line);color:var(--muted)}
.ord button.ok{background:var(--brand);color:#fff;cursor:pointer;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.board{background:var(--board);border-radius:18px;padding:8px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;touch-action:none;user-select:none;-webkit-user-select:none}
.cell{aspect-ratio:1;border-radius:11px;background:var(--cell);display:flex;align-items:center;justify-content:center;position:relative}
.cell.over{box-shadow:inset 0 0 0 3px var(--gold)}
.it{width:88%;height:88%;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:grab;position:relative}
.it svg{width:86%;height:86%}
.it .lv{position:absolute;right:2px;bottom:0;font:700 9px Poppins;color:var(--muted)}
.it.c0{background:#EFE8FB}.it.c1{background:#FFF4E2}.it.c2{background:#E6F2FC}
.it.match{box-shadow:0 0 0 3px var(--gold)}
.it.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.ghost{position:fixed;pointer-events:none;z-index:50;width:56px;height:56px;transform:translate(-50%,-60%) scale(1.15);filter:drop-shadow(0 8px 10px rgba(46,31,87,.3))}
.row{display:flex;gap:8px;align-items:center}
.box{flex:none;border:0;border-radius:16px;background:#FDEFD9;padding:6px 12px;display:flex;align-items:center;gap:8px;font:600 14px Poppins;color:var(--ink);min-height:56px;cursor:pointer;box-shadow:0 3px 0 #E9C995}
.box svg{width:40px;height:40px}.box:active{transform:translateY(2px);box-shadow:0 1px 0 #E9C995}
.tip{flex:1;font-size:12.5px;line-height:1.4;color:var(--muted);background:var(--card);border-radius:14px;padding:8px 10px;min-height:56px;display:flex;align-items:center}
.tip b{color:var(--ink)}
.room{background:var(--card);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.room h2{font:700 18px Lora,serif;margin:0;display:flex;justify-content:space-between;align-items:baseline}
.room h2 small{font:500 12px Poppins;color:var(--muted)}
.room svg.scene{width:100%;height:auto;border-radius:12px;display:block}
.task{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.task button{border:0;border-radius:999px;padding:10px 16px;min-height:44px;font:600 14px Poppins;background:var(--brand);color:#fff;cursor:pointer}
.task button:disabled{background:var(--line);color:var(--muted);cursor:default}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);transition:width .4s}
.fact{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(420px,calc(100% - 24px));background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(46,31,87,.25);z-index:40;font-size:13px;line-height:1.4}
.fact svg{width:44px;height:44px;flex:none}.fact b{display:block;color:#B9761C;font-size:12px}
.fact[hidden]{display:none}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px;font:600 13px Poppins;z-index:60}
.toast[hidden]{display:none}
.foot{font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
.foot button{border:0;background:none;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer;min-height:44px}
.win{text-align:center;padding:6px 0;font:700 18px Lora,serif;color:#2F7D4A}
@media (prefers-reduced-motion:reduce){.ord button.ok,.it.pop{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header><div><h1>Clinicraft <span class="proto">PROTOTYPE</span></h1></div><a href="/">‹ Malady Wise</a></header>
  <div class="hud"><span class="chip" id="en">⚡ 40</span><span class="chip" id="co">🪙 0</span><span class="chip" id="fo">📖 0/15</span></div>

  <div class="board" id="board" aria-label="Merge board"></div>
  <div class="row"><button class="box" id="box" type="button" aria-label="Open the supply box"><svg viewBox="0 0 64 64"><path d="M10 24l22-10 22 10v24L32 58 10 48z" fill="#E9A23B"/><path d="M10 24l22 10 22-10M32 34v24" fill="none" stroke="#B9761C" stroke-width="2.5"/><path d="M26 22h12M32 16v12" stroke="#FFF" stroke-width="4" stroke-linecap="round"/></svg><span>Supply<br>box</span></button><div class="tip" id="tip"><span><b>Ziggy:</b> Tap the supply box for kit. Drag two the same together to make something better.</span></div></div>

  <p class="foot">An early test of a Malady Wise merge game. Facts are general education, not medical advice.<br><button type="button" id="reset">Start again</button></p>
</div>
<div class="fact" id="fact" hidden></div>
<div class="toast" id="toast" hidden></div>

  });

    var el = document.elementFromPoint(e.clientX, e.clientY), cell = el && el.closest && el.closest(".cell"); if (!cell) return;
