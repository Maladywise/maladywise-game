<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tag review | Malady Wise</title>
<style>
:root{--bg:#FAF7F2;--ink:#2A2140;--muted:#6E6585;--brand:#4A3480;--line:#E4DDF0;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#17131F;--ink:#EEE9F7;--muted:#A79FBC;--line:#352D47;--card:#211B2C}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:16px;margin:20px 0 8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.row b{display:block}.row small{color:var(--muted)}
button{border:0;border-radius:999px;padding:8px 14px;font:600 14px system-ui,sans-serif;cursor:pointer}
.yes{background:#2F7A3A;color:#fff}.no{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
.btns{display:flex;gap:6px;flex:none}p.m{color:var(--muted)}
</style>
</head>
<body><main>
<h1>Visitor tag review</h1>
<form id="login" hidden><p class="m">Paste your review key (saved on this device only).</p><input id="k" type="password" autocomplete="off"><p><button class="yes" type="submit">Open</button></p><p id="msg" class="m" role="alert"></p></form>
<div id="app" hidden><h2>Waiting for you</h2><div id="pend"></div><h2>Live</h2><div id="live"></div><p><button class="no" id="out">Forget key on this device</button></p></div>
</main>
<script>
(function(){
var API="https://mw-presence.onrender.com",T={wc:"♿ Wheelchair access",park:"🅿️ Free parking",pram:"🍼 Pram friendly",interp:"🗣️ Interpreters",fees:"💲 Fees online",ah:"🌙 After hours"};
var key="";try{key=localStorage.getItem("mw-tag-key")||""}catch(e){}
var $=function(id){return document.getElementById(id)};
function row(n,sub,btns){var d=document.createElement("div");d.className="row";var t=document.createElement("div");t.innerHTML="<b></b><small></small>";t.firstChild.textContent=n;t.lastChild.textContent=sub;d.appendChild(t);var b=document.createElement("div");b.className="btns";btns.forEach(function(x){b.appendChild(x)});d.appendChild(b);return d}
function btn(cls,txt,fn){var b=document.createElement("button");b.className=cls;b.textContent=txt;b.onclick=fn;return b}
function call(path,method){return fetch(API+path+(path.indexOf("?")<0?"?":"&")+"k="+encodeURIComponent(key),{method:method||"GET"}).then(function(r){if(!r.ok)throw r.status;return r.json()})}
function show(d){$("login").hidden=true;$("app").hidden=false;var P=$("pend"),L=$("live");P.innerHTML="";L.innerHTML="";
 if(!d.pending.length)P.innerHTML='<p class="m">Nothing to check.</p>';
 d.pending.forEach(function(x){P.appendChild(row(x.n,(T[x.t]||x.t)+" · "+x.c+" visitors",[btn("yes","Approve",function(){set(x.p,x.t,1)}),btn("no","Reject",function(){set(x.p,x.t,0)})]))});
 var ks=Object.keys(d.approved);if(!ks.length)L.innerHTML='<p class="m">No visitor tags live yet.</p>';
 ks.forEach(function(p){d.approved[p].forEach(function(t){L.appendChild(row((d.names||{})[p]||p,T[t]||t,[btn("no","Remove",function(){set(p,t,2)})]))})})}
function load(){$("msg").textContent="Checking…";call("/tagq").then(show).catch(function(e){$("app").hidden=true;$("login").hidden=false;$("msg").textContent=e===403?"That key didn't work. Check for spaces and try again.":e===404?"The tag server hasn't been updated yet. On Render, open mw-presence and click Manual Deploy, then Deploy latest commit. Then come back.":"Couldn't reach the server (it may be waking up). Try again in 30 seconds."})}
function set(p,t,v){call("/tagset?p="+encodeURIComponent(p)+"&t="+t+"&v="+v,"POST").then(show)}
$("login").onsubmit=function(ev){ev.preventDefault();key=$("k").value.trim();if(!key)return;try{localStorage.setItem("mw-tag-key",key)}catch(e){}load()};
$("out").onclick=function(){try{localStorage.removeItem("mw-tag-key")}catch(e){}key="";location.reload()};
if(key)load();else $("login").hidden=false;
})();
</script>
</body></html>
