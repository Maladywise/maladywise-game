<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><title>Guess the ECG</title><link rel="stylesheet" href="common.css">
<style>
#head{width:720px}
#head .h1{font-size:74px}
#rg{left:840px;top:222px}
#case{position:absolute;left:90px;right:90px;top:418px;height:236px}
#case .fit{position:absolute;left:32px;right:32px;top:22px;bottom:22px}
#c1 .in{font-size:39px;line-height:1.36;font-weight:500}
#ecgw{position:absolute;top:676px;border-radius:20px;overflow:hidden;border:3px solid #E9968F;background:#FFF4F2}
svg.ecg{display:block;width:100%;height:auto}
svg.ecg .ppr{fill:#FFF4F2}
svg.ecg .gmi{stroke:#F6CFCB;stroke-width:1px;vector-effect:non-scaling-stroke;fill:none}
svg.ecg .gma{stroke:#E9968F;stroke-width:1.8px;vector-effect:non-scaling-stroke;fill:none}
svg.ecg .tr{fill:none;stroke:#161616;stroke-width:3.4px;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
svg.ecg .ld{font:700 3.6px Poppins,sans-serif;fill:#161616}
svg.ecg .ft{font:2.6px Poppins,sans-serif;fill:#8A4A4A;text-anchor:end}
svg.ecg .hm{fill:#C2185B}
svg.ecg .hb{fill:none;stroke:#1565C0;stroke-width:5px;vector-effect:non-scaling-stroke}
svg.ecg .ht{font:700 3.4px Poppins,sans-serif;fill:#1565C0;text-anchor:middle;paint-order:stroke;stroke:#FFF4F2;stroke-width:.9px}
svg.ecg .hr{fill:rgba(21,101,192,.12);stroke:#1565C0;stroke-width:3px;vector-effect:non-scaling-stroke}
svg.ecg .hl-box{fill:rgba(21,101,192,.08);stroke:#1565C0;stroke-width:4px;vector-effect:non-scaling-stroke}
svg.ecg .hl-box.t2{fill:rgba(194,24,91,.07);stroke:#C2185B}
svg.ecg .hl-tag{font:700 3.4px Poppins,sans-serif;fill:#1565C0;text-anchor:end;paint-order:stroke;stroke:#FFF4F2;stroke-width:.9px}
svg.ecg .hl-tag.t2{fill:#C2185B}
svg.ecg.twelve .gmi{opacity:.6}
svg.ecg.twelve .tr{stroke-width:2.6px}
#src{position:absolute;left:90px;right:90px;text-align:center;font-size:24px;color:var(--muted)}
#opts{position:absolute;left:90px;right:90px;top:1200px;height:420px}
</style></head><body><div id="stage">
<div class="layer" id="main">
  <div id="head"><div class="kicker">Arrhythmix</div><div class="h1">Guess the ECG<br>in 10 seconds</div></div>
  <div class="ring" id="rg"></div>
  <div class="card chk" id="case">
    <div class="fit" id="c1" data-fit="40,26"><span class="in" id="vig"></span></div>
    <div class="fit feat" id="c2" data-fit="36,24"><div class="in" id="feats"></div></div>
  </div>
  <div id="ecgw" class="chk"></div>
  <div id="src" class="chk">Fictional case · computer-generated ECG · 25 mm/s</div>
  <div id="opts"></div>
</div>
<div class="layer" id="end"><img class="mascot" alt=""><div class="wm"></div><div class="ln"></div><div class="url"></div></div>
<div class="layer" id="intro"><img class="mascot" alt=""><div class="wm">Malady Wise</div><div class="gm"></div></div>
</div>
<script src="common.js"></script><script src="../../../arrhythmix/ecg.js"></script>
<script>
var OK, NOPT, hl, T0 = 3.0, T1 = 13.0, RV = 13.1, END = 21.0;
window.setup = function (D) {
  brand("Arrhythmix", "arrhythmix", "ECG challenge", D.end_line, "maladywise.com/arrhythmix");
  $("vig").innerHTML = esc(D.vignette).replace(/^(An? \d+-year-old [a-z]+)/, "<b style='color:var(--brand);font-weight:600'>$1</b>");
  $("feats").innerHTML = '<span class="k">Key features</span>' + D.features.map(function (f) { return '<div class="row"><i></i><span>' + esc(f) + "</span></div>"; }).join("");
  var r = ARX_ECG.render(D.ecg, D.seed);
  $("ecgw").innerHTML = r.svg;
  var svg = $("ecgw").querySelector("svg"); hl = svg.querySelector(".hl");
  svg.classList.toggle("twelve", D.ecg.layout === "12");
  var w = 900, h = w * r.H / r.W;
  if (h > 470) { h = 470; w = h * r.W / r.H; }
  css($("ecgw"), { width: (w + 6) + "px", left: (90 + (900 - w) / 2 - 3) + "px" });
  $("src").style.top = (676 + h + 6 + 14) + "px";
  window.declutter = function () { // drop key-feature labels that would overlap (e.g. R-R times on a fast rhythm)
    if (!hl) return;
    var was = hl.style.display; hl.style.display = "inline";
    var kept = [];
    Array.prototype.slice.call(hl.querySelectorAll("text")).forEach(function (el) {
      el.style.display = "";
      var r = el.getBoundingClientRect();
      if (kept.some(function (k) { return r.left < k.right + 14 && r.right > k.left - 14 && r.top < k.bottom && r.bottom > k.top; })) el.style.display = "none";
      else kept.push(r);
    });
    hl.style.display = was;
  };
  $("opts").innerHTML = optsHtml(D.options); OK = D.correct; NOPT = D.options.length;
  $("rg").innerHTML = RING;
  window.DUR = END + 3.2;
  window.CHECK_TIMES = [2.6, 8, 13.6, 16, END + 1.5];
  fitAll(); declutter();
};
window.render = function (t) {
  introAt(t);
  appear($("head"), t, .7, .35);
  pop($("rg"), t, .9, .35); if (t > 13.2) $("rg").style.opacity = 1 - R(t, 13.2, 13.5);
  var left = C(T1 - t, 0, 10);
  ring($("rg"), t < T0 ? 1 : left / 10, t < T1 ? Math.ceil(t < T0 ? 10 : left) : "0");
  if (t > T1 - 3 && t < T1) { var p = (T1 - t) % 1; $("rg").style.transform = "scale(" + (1 + .08 * Math.max(0, p - .7) / .3) + ")"; }
  appear($("case"), t, .8, .35);
  appear($("c1"), t, .8, .3, 13.6, .3, 0);
  appear($("c2"), t, 13.8, .35, null, null, 20);
  var w = eio(R(t, 1.1, 2.1));
  css($("ecgw"), { opacity: t > 1.05 ? 1 : 0, clipPath: "inset(0 " + ((1 - w) * 100) + "% 0 0)" });
  appear($("src"), t, 2.1, .3);
  if (hl) css(hl, { display: t >= 13.6 ? "inline" : "none", opacity: R(t, 13.6, 14) });
  for (var i = 0; i < NOPT; i++) {
    var el = $("o" + i); appear(el, t, 2.0 + i * .15, .3, null, null, 60);
    el.classList.toggle("ok", i === OK && t >= RV);
    if (t >= RV && i !== OK) el.style.opacity = 1 - .65 * R(t, RV, RV + .3);
    if (i === OK && t >= RV) { var k = R(t, RV, RV + .4); el.style.transform = "scale(" + (1 + .06 * Math.sin(k * Math.PI)) + ")"; }
  }
  endAt(t, END);
};
</script></body></html>
