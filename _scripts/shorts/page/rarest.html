<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><title>Rarest answer wins</title><link rel="stylesheet" href="common.css">
<style>
#prompt{position:absolute;left:90px;right:90px;top:348px;height:186px;padding:20px 34px}
#prompt .fit{height:100%}
#prompt .in{font-family:Lora;font-weight:700;line-height:1.2;color:var(--ink)}
#legend,#note{position:absolute;left:90px;right:90px;top:548px;height:44px;text-align:center}
#legend .in{font-size:29px;font-weight:500;color:var(--muted)}
#note .in{font-size:31px;font-weight:600;color:#8A3FA3}
#list{position:absolute;left:90px;right:90px;top:606px}
.row{position:absolute;left:0;right:0;height:96px;border-radius:22px;background:#fff;border:3px solid var(--lilac2);display:flex;align-items:center;gap:14px;padding:0 18px 0 30px;font-weight:600;box-shadow:0 6px 16px rgba(74,52,128,.08)}
.row .fit{flex:1;height:90px;line-height:1.08}
.pill{flex:0 0 auto;font-size:27px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:10px 20px;white-space:nowrap}
.pill i{font-style:normal;font-size:32px;letter-spacing:0;margin-left:10px}
.t1 .pill{background:#EEEAF4;color:#5E557A}
.t3 .pill{background:var(--lilac);color:var(--brand)}
.t6{border-color:#A7B8C8}.t6 .pill{background:#E4ECF3;color:#3C4A57}
.t10{border-color:#E5B94A;background:#FFFBEF}.t10 .pill{background:#F7EBC9;color:#8A6408}
.t20{border-color:#B05FC7;background:linear-gradient(135deg,#FBE3F1,#E6DDFB,#DDF3F7);height:104px}
.t20 .pill{background:#8A3FA3;color:#fff;font-size:30px}
#mys{border-style:dashed;justify-content:center;color:var(--muted);font-weight:600;font-size:38px}
.sp{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;background:#B05FC7;z-index:5;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
</style></head><body><div id="stage">
<div class="layer" id="main">
  <div id="head"><div class="kicker">Zebritis</div><div class="h1">Rarest answer wins</div></div>
  <div class="card chk" id="prompt"><div class="fit" data-fit="52,30"><span class="in" id="pq"></span></div></div>
  <div id="legend" class="fit one chk" data-fit="29,20"><span class="in">Horse 1 · Pony 3 · Donkey 6 · Zebra 10 · Unicorn 20</span></div>
  <div id="note" class="fit one chk" data-fit="31,20"><span class="in" id="notet"></span></div>
  <div id="list"></div>
</div>
<div class="layer" id="end"><img class="mascot" alt=""><div class="wm"></div><div class="ln"></div><div class="url"></div></div>
<div class="layer" id="intro"><img class="mascot" alt=""><div class="wm">Malady Wise</div><div class="gm"></div></div>
</div>
<script src="common.js"></script>
<script>
var TN = { 1: "Horse", 3: "Pony", 6: "Donkey", 10: "Zebra", 20: "Unicorn" };
var A, N, GAP = 108, START = 2.3, STEP, MYS, UNI, END;
window.setup = function (D) {
  brand("Zebritis", "zebritis", "Rarest answer wins", D.end_line, "maladywise.com/zebritis");
  $("pq").textContent = D.prompt;
  $("notet").textContent = D.note;
  A = D.rows; N = A.length; STEP = N > 7 ? .9 : 1.0;
  MYS = START + (N - 1) * STEP + .2; UNI = MYS + 1.8; END = UNI + 4.2;
  $("list").innerHTML = A.map(function (a, i) {
    return '<div class="row chk t' + a[1] + '" id="r' + i + '" style="top:' + (i * GAP) + 'px"><div class="fit" data-fit="' + (a[1] === 20 ? 42 : 38) + ',22"><span class="in">' + esc(a[0]) + '</span></div><span class="pill">' + TN[a[1]] + "<i>+" + a[1] + "</i></span></div>";
  }).join("") + '<div class="row" id="mys" style="top:' + ((N - 1) * GAP) + 'px">And the unicorn is…</div>' +
    [0, 1, 2, 3, 4, 5, 6, 7].map(function (k) { return '<div class="sp" id="sp' + k + '"' + (k % 2 ? ' style="background:#E5B94A"' : "") + "></div>"; }).join("");
  window.DUR = END + 3.2;
  window.CHECK_TIMES = [1.6, MYS + .5, UNI + 2.5, END + 1.5];
  fitAll();
};
window.render = function (t) {
  introAt(t);
  appear($("head"), t, .7, .35);
  appear($("prompt"), t, .85, .35);
  appear($("legend"), t, 1.3, .3, UNI + .8, .3, 20);
  appear($("note"), t, UNI + 1.2, .35, null, null, 20);
  A.forEach(function (a, i) {
    var el = $("r" + i), last = i === N - 1, at = last ? UNI : START + i * STEP, x = R(t, at, at + .4), e = eb(x);
    css(el, { opacity: x > 0 ? 1 : 0, transform: "translateX(" + ((1 - e) * 1000 * (i % 2 ? -1 : 1)) + "px) rotate(" + ((1 - e) * (i % 2 ? -6 : 6)) + "deg)" });
    if (last && t > UNI) { var k = R(t, UNI + .3, UNI + .9); el.style.transform += " scale(" + (1 + .08 * Math.sin(k * Math.PI)) + ")"; }
  });
  var m = $("mys"), mx = R(t, MYS, MYS + .3);
  css(m, { opacity: t < UNI ? eo(mx) * (.75 + .25 * Math.sin((t - MYS) * 9)) : 0 });
  for (var k = 0; k < 8; k++) {
    var sp = $("sp" + k), q = R(t, UNI + .35, UNI + 1.5), ang = k / 8 * Math.PI * 2 + .3;
    var cx = 450 + Math.cos(ang) * (120 + 380 * eo(q)), cy = (N - 1) * GAP + 48 + Math.sin(ang) * (40 + 110 * eo(q));
    css(sp, { left: cx + "px", top: cy + "px", opacity: q > 0 && q < 1 ? 1 - q : 0, transform: "scale(" + (1.6 - q) + ") rotate(" + q * 180 + "deg)" });
  }
  endAt(t, END);
};
</script></body></html>
