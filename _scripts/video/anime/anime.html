<!doctype html>
<html><head><meta charset="utf-8">
<!-- Anime-style mascot back-story short. Served from the repo root (python3 -m http.server) and driven frame by frame
     by render.js: window.draw(t) paints the frame at time t (seconds). The story comes from story.json (?s=dex). -->
<style>
@font-face{font-family:P;src:url(/assets/fonts/poppins-latin-600-normal.woff2)}
@font-face{font-family:L;src:url(/assets/fonts/lora-latin-700-normal.woff2)}
html,body{margin:0;background:#120E1E}
#v{position:relative;width:540px;height:960px;overflow:hidden;font-family:P;background:#1B1430}
.l{position:absolute;inset:0}
#bg{background:radial-gradient(circle at 50% 42%,var(--c1,#FFB36B) 0,var(--c2,#E2557A) 45%,var(--c3,#3A1E5E) 100%)}
#lines{opacity:0}
#dots{background-image:radial-gradient(rgba(255,255,255,.18) 1.6px,transparent 1.7px);background-size:14px 14px;mix-blend-mode:overlay}
#panel{opacity:0}
.mc{position:absolute;filter:drop-shadow(0 10px 0 rgba(0,0,0,.25))}
#cap{position:absolute;left:28px;right:28px;bottom:70px;text-align:center;color:#fff;font-size:27px;line-height:1.3;
     paint-order:stroke fill;-webkit-text-stroke:7px #1B1430;letter-spacing:.2px}
#cap b{color:#FFE066}
#title{position:absolute;left:0;right:0;text-align:center;color:#FFE066;font-family:P;paint-order:stroke fill;-webkit-text-stroke:10px #1B1430}
#ep{position:absolute;left:0;right:0;text-align:center;color:#fff;font-size:22px;letter-spacing:8px;paint-order:stroke fill;-webkit-text-stroke:6px #1B1430}
#flash{background:#fff;opacity:0}
#bars:before,#bars:after{content:"";position:absolute;left:0;right:0;height:38px;background:#000}
#bars:before{top:0}#bars:after{bottom:0}
.fx{position:absolute;color:#fff;font-family:P;paint-order:stroke fill;-webkit-text-stroke:8px #1B1430}
.spark{position:absolute;width:26px;height:26px}
</style></head><body>
<div id="v">
 <div class="l" id="bg"></div>
 <svg class="l" id="lines" viewBox="-270 -480 540 960"></svg>
 <div class="l" id="dots"></div>
 <div class="l" id="stage"></div>
 <div class="l" id="panel"></div>
 <div id="ep"></div><div id="title"></div>
 <div id="cap"></div>
 <div class="l" id="bars"></div>
 <div class="l" id="flash"></div>
</div>
<script>
// speed lines: 72 thin wedges radiating from the centre
(function(){var s="";for(var i=0;i<72;i++){var a=i/72*Math.PI*2+(i%3)*0.013,w=0.012+(i*7%5)*0.004,r0=120+(i*37%90),R=1200;
 s+='<polygon fill="#fff" points="'+[Math.cos(a-w)*r0,Math.sin(a-w)*r0,Math.cos(a)*R,Math.sin(a)*R,Math.cos(a+w)*r0,Math.sin(a+w)*r0].map(function(n){return n.toFixed(1)}).join(",")+'"/>'}
 document.getElementById("lines").innerHTML=s})();
var $=function(i){return document.getElementById(i)};
function ease(x){x=Math.max(0,Math.min(1,x));return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function pop(x){x=Math.max(0,Math.min(1,x));var c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}
function clamp(x){return Math.max(0,Math.min(1,x))}
var SPARK='<svg viewBox="-10 -10 20 20"><path d="M0-10L2.5-2.5 10 0 2.5 2.5 0 10-2.5 2.5-10 0-2.5-2.5z" fill="#FFF6C8" stroke="#1B1430" stroke-width="1.2"/></svg>';
var S=null;
window.setup=function(story){S=story;};
// helpers to place things
function img(src,x,y,size,rot,op,extra){return '<img class="mc" src="'+src+'" style="left:'+(x-size/2)+'px;top:'+(y-size/2)+'px;width:'+size+'px;height:'+size+'px;transform:rotate('+(rot||0)+'deg);opacity:'+(op==null?1:op)+';'+(extra||"")+'">'}
function sparks(t,n,cx,cy,r){var h="";for(var i=0;i<n;i++){var a=i*2.39996+t*0.6,rr=r*(0.6+0.4*Math.sin(i*1.7+t*2)),s=0.5+0.5*Math.abs(Math.sin(t*3+i));
 h+='<div class="spark" style="left:'+(cx+Math.cos(a)*rr-13)+'px;top:'+(cy+Math.sin(a)*rr*0.8-13)+'px;transform:scale('+s.toFixed(2)+') rotate('+(t*90+i*30)+'deg)">'+SPARK+'</div>'}return h}
window.draw=function(T){
 var sc=null,t0=0;for(var i=0;i<S.scenes.length;i++){if(T<t0+S.scenes[i].d){sc=S.scenes[i];break}t0+=S.scenes[i].d}
 if(!sc){sc=S.scenes[S.scenes.length-1];t0-=sc.d}
 var t=T-t0,d=sc.d,u=t/d;
 var pal=sc.pal||["#FFB36B","#E2557A","#3A1E5E"];var bg=$("bg").style;bg.setProperty("--c1",pal[0]);bg.setProperty("--c2",pal[1]);bg.setProperty("--c3",pal[2]);
 $("lines").style.opacity=sc.lines?(0.18+0.12*Math.sin(T*40)):0;$("lines").style.transform="rotate("+(T*6)+"deg) scale("+(1+0.05*Math.sin(T*20))+")";
 var shake=sc.shake&&t<0.5?(1-t/0.5)*sc.shake:0;$("v").style.transform="translate("+(Math.sin(T*90)*shake)+"px,"+(Math.cos(T*77)*shake)+"px)";
 $("flash").style.opacity=t<0.25?(1-t/0.25)*(sc.flash||0.85):0;
 $("stage").innerHTML=sc.f(t,d,T,{img:img,sparks:sparks,ease:ease,pop:pop,clamp:clamp,M:S.mascot});
 var ci=sc.cap||"",cp=$("cap");cp.innerHTML=ci;cp.style.opacity=clamp((t-0.25)/0.3)*clamp((d-t)/0.25);cp.style.transform="translateY("+(1-ease(clamp((t-0.25)/0.35)))*16+"px)";
 $("title").innerHTML=sc.title||"";$("ep").innerHTML=sc.ep||"";
 if(sc.title){var k=pop(clamp((t-0.2)/0.5));$("title").style.cssText="top:"+(sc.ty||600)+"px;font-size:"+(sc.ts||62)+"px;line-height:1.05;transform:scale("+k+") rotate(-4deg);opacity:"+clamp(t/0.2);
  $("ep").style.cssText="top:"+((sc.ty||600)-46)+"px;opacity:"+clamp((t-0.6)/0.3)}
};
</script></body></html>
