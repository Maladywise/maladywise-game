name: Daily reminder email
# "Today's 3 are ready" to Zebra Mail subscribers tagged daily-3.
# Off until the repo variable DAILY_REMINDER is set to "on" and the secret BUTTONDOWN_API_KEY exists.
on:
  schedule:
    - cron: "50 19 * * *"   # 6:50am Sydney in summer (AEDT), 5:50am in winter
  workflow_dispatch:
jobs:
  send:
    if: vars.DAILY_REMINDER == 'on'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 _scripts/daily_reminder.py
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
