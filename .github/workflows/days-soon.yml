name: Refresh home page health days
# Rewrites data/days-soon.json (yesterday to 35 days ahead, Sydney) so the home page day box stays small and current.
# If this ever stops running, the home page falls back to the full data/health-days.json, so nothing breaks.
on:
  schedule:
    - cron: "7 13 * * *"   # about 12:07am Sydney (summer) / 11:07pm (winter), daily
  push:
    branches: [main]
    paths: ["data/health-days.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: days-soon
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild data/days-soon.json
        run: python3 _scripts/build_days.py --soon-only
      - name: Rebuild llms.txt (site map for AI assistants)
        run: python3 _scripts/build_llms.py
      - name: Save it
        run: |
          if [ -n "$(git status --porcelain -- data/days-soon.json llms.txt)" ]; then
            git config user.name "Maladywise"
            git config user.email "maladywise@gmail.com"
            git add data/days-soon.json llms.txt
            git commit -m "Refresh home page health days (days-soon.json)"
            for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
          fi
