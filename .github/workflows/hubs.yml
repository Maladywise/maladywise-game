name: Hubs menu
# Weekly: puts the most-used topic hubs (last 28 days, from mw-presence /hubrank) in the top menu.
# See data/hubs.json and _scripts/hub_menu.py. No secrets needed.
on:
  schedule:
    - cron: "23 17 * * 0"   # Mon 4:23am AEDT
    - cron: "53 18 * * 0"   # backup, Mon 5:53am AEDT
  workflow_dispatch:
permissions:
  contents: write
jobs:
  menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 _scripts/hub_menu.py
      - name: Commit
        run: |
          git config user.name "Maladywise"
          git config user.email "maladywise@gmail.com"
          git add -A assets/site.js '*.html' '*.py' '*.js'
          git diff --cached --quiet && exit 0
          git commit -m "Hubs menu: weekly popularity update"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
